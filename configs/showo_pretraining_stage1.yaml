wandb:
  entity: null
#  run_id: askkz9i2
  resume: 'auto'

experiment:
    project: "training"
    name: "show-o-training-stage1"
    output_dir: "show-o-training-stage1"
    max_train_examples_t2i: 40000000
    max_train_examples_mmu: 40000000
    max_train_examples_edit: 1000000
    save_every: 10000
    eval_every: 2500
    generate_every: 1000
    log_every: 50
    log_grad_norm_every: 500
    resume_from_checkpoint: 'latest'

model:
    vq_model:
        type: "magvitv2"
        vq_model_name: "showlab/magvitv2"

    showo:
        load_from_showo: False
        pretrained_model_path: "showlab/show-o"
        w_clip_vit: False
        vocab_size: 58498
        llm_vocab_size: 50295
        llm_model_path: 'microsoft/phi-1_5'
        codebook_size: 8192
        num_vq_tokens: 256
        num_new_special_tokens: 10  # <|soi|> <|eoi|> <|sov|> <|eov|> <|t2i|> <|mmu|> <|t2v|> <|v2v|> <|lvg|> <|pad|>
        adacycle_fork_enabled: False
        adacycle_router_hidden_size: null
        adacycle_branch_bottleneck: null
        adacycle_branch_dropout: 0.0
        adacycle_routing_granularity: "layer"  # "layer" or "token"
        adacycle_hard_routing: False
        adacycle_hard_routing_st: True
        adacycle_generation_peak_layer: null

    gradient_checkpointing: True

dataset:
    gen_type: "imagenet1k"
    und_type: "captioning"
    combined_loader_mode: "max_size_cycle"
    params:
        train_t2i_shards_path_or_url: "/mnt/bn/vgfm2/test_dit/imagenet/ILSVRC/Data/CLS-LOC/train"
        train_mmu_shards_path_or_url: [ "/mnt/bn/vgfm2/test_mlx/xavier/data/SA1B2/sa_{000000..000999}.tar",
                                        "/mnt/bn/vgfm/cc12m/images/{00000..01242}.tar",
                                        "/mnt/bn/vgfm/laion5b/laion-aesthetics-12m-images/{00000..01209}.tar" ]
        train_lm_shards_path_or_url: "/mnt/bn/vgfm2/test_mlx/xavier/data/falcon-refinedweb/data/*.parquet"
        train_edit_shards_path_or_url: null
        add_caption_prompt: True
        external_caption_path: "/mnt/bn/vgfm2/test_mlx/xavier/data/SAM-LLaVA-Captions10M"
        external_journeydb_caption_path: "/mnt/bn/vgfm2/test_mlx/xavier/code/3062/open_muse/train_journeydb_anno.json"
        external_laion12m_caption_path: "/mnt/bn/vgfm/laion5b/laion-aesthetics-12m-captions"
        external_cc12m_caption_path: '/mnt/bn/vgfm/cc12m/captions/'
        validation_prompts_file: "validation_prompts/imagenet_prompts.txt"
        shuffle_buffer_size: 1000
        num_workers: 32
        resolution: 256
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 128 # for text tokens
        resolution: 256
        center_crop: False
        random_flip: False

optimizer:
    name: adamw
    params: # default adamw params
        learning_rate: 1e-4
        scale_lr: False # scale learning rate by total batch size
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 5000

training:
    gradient_accumulation_steps: 1
    noise_type: "mask"
    batch_size_t2i: 15
    batch_size_lm: 4
    batch_size_mmu: 10
    batch_size_edit: 0
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    max_train_steps: 500000
    overfit_one_batch: False
    cond_dropout_prob: 0.1
    min_masking_rate: 0.0
    label_smoothing: 0.0
    max_grad_norm: null
    guidance_scale: 1.5
    generation_timesteps: 12
    t2i_coeff: 1.0
    lm_coeff: 0.1
    mmu_coeff: 1.0
    adacycle_align_coeff: 0.0
    adacycle_g2u_coeff: 0.0
    adacycle_u2g_coeff: 0.0
    adacycle_preserve_coeff: 0.0
    adacycle_enable_cycle_batches: False
    adacycle_cycle_every: 1
    adacycle_cycle_max_samples: 2
    adacycle_g2u_cycle_coeff: 0.0
    adacycle_g2u_verify_cycle_coeff: 0.0
    adacycle_enable_semantic_verification: True
    adacycle_semantic_verification_prefix: "Verify object counts, attribute bindings, spatial relations, VQA answers, and scene graph consistency."
    adacycle_u2g_cycle_coeff: 0.0
    adacycle_preserve_cycle_coeff: 0.0
    adacycle_u2g_mask_ratio: 0.50
    adacycle_edit_mask_ratio: 0.25
    adacycle_edit_contiguous_mask: True
    adacycle_plan_source: "caption"  # "caption" or offline/eval use of understanding-generated plans
    adacycle_online_plan_every: 1
    adacycle_online_plan_max_new_tokens: 96
    adacycle_online_plan_top_k: 1
    adacycle_plan_prefix: "Structured semantic plan: objects, attributes, relationships, layout, style."
    adacycle_enable_edit_batches: False
    adacycle_edit_every: 1
    adacycle_edit_max_samples: 2
    adacycle_edit_coeff: 0.0
    adacycle_edit_preserve_coeff: 0.0
    adacycle_edit_pixel_coeff: 0.0
    adacycle_preserve_pixel_coeff: 0.0
    adacycle_preserve_ssim_coeff: 0.0
    adacycle_preserve_lpips_coeff: 0.0
    adacycle_soft_decode_temperature: 1.0
    adacycle_trace_jsonl: null
